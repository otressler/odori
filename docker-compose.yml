services:
  odori-web:
    image: ghcr.io/otressler/odori:${ODORI_VERSION}
    environment:
      INGREDIENT_EMBEDDINGS_ENABLED: "${INGREDIENT_EMBEDDINGS_ENABLED}"
      AZURE_OPENAI_ENDPOINT: "${AZURE_OPENAI_ENDPOINT}"
      AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY}"
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}"
      AZURE_OPENAI_IMAGE_DEPLOYMENT: "${AZURE_OPENAI_IMAGE_DEPLOYMENT:-gpt-image-2}"
      AZURE_OPENAI_PANTRY_ICON_DEPLOYMENT: "${AZURE_OPENAI_PANTRY_ICON_DEPLOYMENT}"
      AZURE_OPENAI_PANTRY_ICON_NATIVE_TRANSPARENCY: "${AZURE_OPENAI_PANTRY_ICON_NATIVE_TRANSPARENCY:-false}"
      AZURE_OPENAI_IMAGE_API_VERSION: "${AZURE_OPENAI_IMAGE_API_VERSION:-2025-04-01-preview}"
      AZURE_OPENAI_IMAGE_TIMEOUT_SECONDS: "${AZURE_OPENAI_IMAGE_TIMEOUT_SECONDS:-60}"
      RECIPE_GENERATION_ENABLED: "${RECIPE_GENERATION_ENABLED:-false}"
      AZURE_OPENAI_RECIPE_GENERATION_DEPLOYMENT: "${AZURE_OPENAI_RECIPE_GENERATION_DEPLOYMENT:-}"
      AZURE_OPENAI_RECIPE_GENERATION_TIMEOUT_SECONDS: "${AZURE_OPENAI_RECIPE_GENERATION_TIMEOUT_SECONDS:-30}"
      AZURE_OPENAI_RECIPE_IMPORT_DEPLOYMENT: "${AZURE_OPENAI_RECIPE_IMPORT_DEPLOYMENT:-}"
      AZURE_OPENAI_RECIPE_IMPORT_TIMEOUT_SECONDS: "${AZURE_OPENAI_RECIPE_IMPORT_TIMEOUT_SECONDS:-45}"
      RECIPE_GENERATION_DAILY_LIMIT: "${RECIPE_GENERATION_DAILY_LIMIT:-3}"
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: "${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-30}"
      DEBUG: "${DEBUG}"
      DATABASE_URL: "${DATABASE_URL}"
      SESSION_SECRET: "${SESSION_SECRET}"
      SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-true}"
      SECURE_HSTS_SECONDS: "${SECURE_HSTS_SECONDS:-31536000}"
      SECURE_HSTS_PRELOAD: "${SECURE_HSTS_PRELOAD:-true}"
      ALLOWED_TAILNET_HOST: "${ALLOWED_TAILNET_HOST}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS}"
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
    command: gunicorn --bind 0.0.0.0:8000 --workers 1 --worker-class gthread --threads 4 --access-logfile - --error-logfile - --capture-output odori.wsgi:application
    depends_on:
      postgres:
        condition: service_healthy
      odori-migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/data/uploads
    networks: [proxy, internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.odori.rule=Host(`${ALLOWED_TAILNET_HOST}`)
      - traefik.http.routers.odori.entrypoints=websecure
      - traefik.http.routers.odori.tls=true
      - traefik.http.routers.odori.tls.certresolver=inwx
      - traefik.http.services.odori.loadbalancer.server.port=8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; request = urllib.request.Request('http://localhost:8000/health/live', headers={'Host': os.environ['ALLOWED_TAILNET_HOST']}); urllib.request.urlopen(request)"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
  odori-worker:
    image: ghcr.io/otressler/odori:${ODORI_VERSION}
    environment:
      INGREDIENT_EMBEDDINGS_ENABLED: "${INGREDIENT_EMBEDDINGS_ENABLED}"
      AZURE_OPENAI_ENDPOINT: "${AZURE_OPENAI_ENDPOINT}"
      AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY}"
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}"
      AZURE_OPENAI_IMAGE_DEPLOYMENT: "${AZURE_OPENAI_IMAGE_DEPLOYMENT:-gpt-image-2}"
      AZURE_OPENAI_PANTRY_ICON_DEPLOYMENT: "${AZURE_OPENAI_PANTRY_ICON_DEPLOYMENT}"
      AZURE_OPENAI_PANTRY_ICON_NATIVE_TRANSPARENCY: "${AZURE_OPENAI_PANTRY_ICON_NATIVE_TRANSPARENCY:-false}"
      AZURE_OPENAI_IMAGE_API_VERSION: "${AZURE_OPENAI_IMAGE_API_VERSION:-2025-04-01-preview}"
      AZURE_OPENAI_IMAGE_TIMEOUT_SECONDS: "${AZURE_OPENAI_IMAGE_TIMEOUT_SECONDS:-60}"
      AZURE_OPENAI_IMAGE_MIN_INTERVAL_SECONDS: "${AZURE_OPENAI_IMAGE_MIN_INTERVAL_SECONDS:-12}"
      RECIPE_GENERATION_ENABLED: "${RECIPE_GENERATION_ENABLED:-false}"
      AZURE_OPENAI_RECIPE_GENERATION_DEPLOYMENT: "${AZURE_OPENAI_RECIPE_GENERATION_DEPLOYMENT:-}"
      AZURE_OPENAI_RECIPE_GENERATION_TIMEOUT_SECONDS: "${AZURE_OPENAI_RECIPE_GENERATION_TIMEOUT_SECONDS:-30}"
      AZURE_OPENAI_RECIPE_IMPORT_DEPLOYMENT: "${AZURE_OPENAI_RECIPE_IMPORT_DEPLOYMENT:-}"
      AZURE_OPENAI_RECIPE_IMPORT_TIMEOUT_SECONDS: "${AZURE_OPENAI_RECIPE_IMPORT_TIMEOUT_SECONDS:-45}"
      RECIPE_GENERATION_DAILY_LIMIT: "${RECIPE_GENERATION_DAILY_LIMIT:-3}"
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: "${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-30}"
      DEBUG: "${DEBUG}"
      DATABASE_URL: "${DATABASE_URL}"
      SESSION_SECRET: "${SESSION_SECRET}"
    command: python manage.py worker
    depends_on:
      postgres:
        condition: service_healthy
      odori-migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/data/uploads
    networks: [internal, egress]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "manage.py",
          "shell",
          "-c",
          "from django.conf import settings; from django.utils import timezone; from core.models import WorkerHeartbeat; heartbeat = WorkerHeartbeat.objects.filter(name='default').first(); raise SystemExit(not (heartbeat and timezone.now() - heartbeat.last_heartbeat_at <= timezone.timedelta(seconds=settings.WORKER_HEARTBEAT_MAX_AGE_SECONDS)))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
  odori-migrate:
    image: ghcr.io/otressler/odori:${ODORI_VERSION}
    environment:
      DEBUG: "${DEBUG}"
      DATABASE_URL: "${DATABASE_URL}"
      SESSION_SECRET: "${SESSION_SECRET}"
    command: python manage.py migrate --noinput
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: odori
      POSTGRES_USER: odori
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odori -d odori"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [internal]
    mem_limit: 1500m
networks:
  proxy:
    external: true
  internal:
    internal: true
  egress: {}
volumes:
  postgres:
  uploads:
