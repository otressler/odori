name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-26.04-arm
    env:
      DEBUG: "true"
      SESSION_SECRET: ci-secret-value-with-more-than-fifty-characters-and-unique-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run core pantry recipes planning shopping
      - run: python -m ruff check .
      - run: python manage.py collectstatic --noinput
      - run: DEBUG=false SESSION_SECRET=ci-secret-value-with-more-than-fifty-characters-and-unique-123 SECURE_SSL_REDIRECT=true SECURE_HSTS_SECONDS=31536000 SECURE_HSTS_PRELOAD=true python manage.py check --deploy
      - run: python -m pytest
      - run: docker compose --env-file .env.example config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
