services:
  test:
    build:
      context: .
      target: test
    environment:
      DEBUG: "true"
      DATABASE_URL: sqlite:////tmp/odori-test.sqlite3
      SESSION_SECRET: test-only-secret
      ORBIT_ENABLED: "false"
    networks: !override [net]
  odori-web:
    build: .
    environment: !override
      ALLOWED_HOSTS: "localhost,127.0.0.1,${ALLOWED_HOSTS}"
      SECURE_SSL_REDIRECT: false
      SECURE_HSTS_SECONDS: 0
      SECURE_HSTS_PRELOAD: false
    env_file: .env
    ports: ["8000:8000"]
    networks: !override [net]
    labels: !reset []
  odori-worker:
    build: .
    environment: !reset []
    env_file: .env
    networks: !override [net]
  odori-migrate:
    build: .
    environment: !reset []
    env_file: .env
    networks: !override [net]
  postgres:
    env_file: .env
    ports: ["5432:5432"]
    networks: !override [net]
networks:
  proxy: !reset null
  internal: !reset null
  net: {
    internal: false
  }
volumes:
  postgres:
    name: odori_dev_postgres
  uploads:
    name: odori_dev_uploads
