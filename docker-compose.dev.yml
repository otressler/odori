services:
  odori-web:
    build: .
    environment:
      DEBUG: "true"
      DATABASE_URL: postgresql://odori:odori@postgres:5432/odori
      SESSION_SECRET: local-development-only
      ALLOWED_TAILNET_HOST: localhost
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    ports: ["8000:8000"]
    networks: !override [internal]
    labels: !reset []
  odori-worker:
    build: .
    environment:
      DEBUG: "true"
      DATABASE_URL: postgresql://odori:odori@postgres:5432/odori
      SESSION_SECRET: local-development-only
  postgres:
    environment:
      POSTGRES_PASSWORD: odori
    ports: ["5432:5432"]
    networks: [internal]
networks:
  proxy: !reset null
  internal: {}
volumes:
  postgres:
    name: odori_dev_postgres
  uploads:
    name: odori_dev_uploads
