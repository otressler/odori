services:
  odori-web:
    build: .
    environment: !reset []
    env_file: .env
    ports: ["8000:8000"]
    networks: !override [internal]
    labels: !reset []
  odori-worker:
    build: .
    environment: !reset []
    env_file: .env
  postgres:
    environment: !reset []
    env_file: .env
    ports: ["5432:5432"]
    networks: [internal]
networks:
  proxy: !reset null
  internal: {}
volumes:
  postgres:
    name: odori_dev_postgres
  uploads:
    name: odori_dev_uploads
